<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Slider</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>User Profile Slider</h1>
    <div id="card">
        <div id="info">
            <div id="img">
                <img id="img1" src="https://i.pravatar.cc/150?img=12" alt="James Müller" />
            </div>
            <div id="name">
                <p style="color: #1C1A18; padding-top: 12px;">James Müller</p>
            </div>
            <div id="location">
                <p>Berlin, DE</p>
            </div>
            <div id="bio">
                Full stack engineer shipping open source devtools used by 40k developers.
                Runs on cold brew and mechanical keyboards. Believes great software
                should feel invisible. Arch Linux evangelist, reluctant TypeScript convert.
            </div>
        </div>

    </div>
    <div class="btns">
        <button id="prevbtn">Previous</button>
        <button id="nextbtn">Next</button>
    </div>


    <script src="index.js"></script>
</body>

</html>
